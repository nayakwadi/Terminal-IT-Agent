<svg viewBox="0 0 1600 1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B4757"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1A1A1A; }
      .sub { font-size: 13px; fill: #555; }
      .zone-title { font-size: 15px; font-weight: 700; fill: #0F4C81; }
      .box-title { font-size: 13px; font-weight: 700; fill: #1A1A1A; }
      .box-sub { font-size: 11px; fill: #333; }
      .mono { font-size: 10px; fill: #1A1A1A; font-family: Consolas, 'Courier New', monospace; }
      .note { font-size: 11px; fill: #666; }
      .small { font-size: 10px; fill: #666; }
      .legend { font-size: 11px; fill: #1A1A1A; }
      .guardrail-fill { fill: #FFF3E0; }
      .guardrail-stroke { stroke: #E07B00; }
    </style>
  </defs>

  <text x="40" y="40" class="title">Terminal IT Agent: UC-01 Policy Conflict Detection — Architecture</text>
  <text x="40" y="62" class="sub">Helpdesk ticket → Bedrock Knowledge Base retrieval → LLM reasoning with Guardrails → structured finding → MS Teams alert. us-east-1. Replication-grade.</text>

  <!-- Row labels -->
  <text x="20" y="160" class="zone-title" transform="rotate(-90 20 160)">Input</text>
  <text x="20" y="380" class="zone-title" transform="rotate(-90 20 380)">Agent runtime</text>
  <text x="20" y="700" class="zone-title" transform="rotate(-90 20 700)">Bedrock + storage</text>
  <text x="20" y="960" class="zone-title" transform="rotate(-90 20 960)">Output</text>

  <!-- Row 1: Input -->
  <g>
    <rect x="60" y="100" width="320" height="140" rx="10" fill="#E3EEF8" stroke="#0F4C81" stroke-width="1.5"/>
    <text x="80" y="125" class="box-title">Helpdesk ticket sources</text>
    <text x="80" y="146" class="box-sub">- Text files in sample-tickets/ (current)</text>
    <text x="80" y="163" class="box-sub">- ServiceNow webhook (Phase 1.5)</text>
    <text x="80" y="180" class="box-sub">- Jira Service Management (later)</text>
    <text x="80" y="197" class="box-sub">- MS Teams chatbot trigger (later)</text>
    <text x="80" y="220" class="box-sub" font-style="italic">Format: free-text. Required fields: ticket id,</text>
    <text x="80" y="234" class="box-sub" font-style="italic">reporter, description, attempted steps.</text>

    <rect x="420" y="100" width="320" height="140" rx="10" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="440" y="125" class="box-title">Cross-cutting concerns</text>
    <text x="440" y="146" class="box-sub">Identity: IAM user (named profile), no long-</text>
    <text x="440" y="161" class="box-sub">lived keys in app. AWS_PROFILE only.</text>
    <text x="440" y="180" class="box-sub">Encryption: KMS-CMK on S3 + OpenSearch.</text>
    <text x="440" y="199" class="box-sub">Audit: CloudTrail org trail (all API calls).</text>
    <text x="440" y="218" class="box-sub">Region: us-east-1 (NAIC data residency).</text>

    <rect x="780" y="100" width="780" height="140" rx="10" fill="#F4F8FC" stroke="#0F4C81" stroke-width="1.5"/>
    <text x="800" y="125" class="zone-title">What this system does (in one sentence)</text>
    <text x="800" y="150" class="box-sub">Reads a helpdesk ticket, retrieves the most relevant policy chunks from a Bedrock Knowledge</text>
    <text x="800" y="167" class="box-sub">Base built over uploaded policy documents, asks an LLM to reason whether the issue is a</text>
    <text x="800" y="184" class="box-sub">cross-domain policy conflict, and posts the structured finding to MS Teams as an Adaptive Card.</text>
    <text x="800" y="208" class="box-sub" font-weight="bold">Bedrock Guardrails sit in front of the LLM and intercept tickets that violate restricted topics</text>
    <text x="800" y="225" class="box-sub" font-weight="bold">(credential sharing, security-control bypass). Guardrail interventions become critical findings.</text>
  </g>

  <!-- Row 2: Agent runtime -->
  <g>
    <rect x="60" y="280" width="1500" height="220" rx="10" fill="#FFF4D6" stroke="#A37200" stroke-width="2"/>
    <text x="80" y="305" class="zone-title" fill="#A37200">Agent runtime (Phase 1: local Python script; Phase 1.5: Lambda + API Gateway)</text>

    <!-- Step 1 box -->
    <rect x="80" y="320" width="340" height="160" rx="8" fill="#FFFFFF" stroke="#A37200" stroke-width="1.2"/>
    <text x="98" y="343" class="box-title">1. Query builder</text>
    <text x="98" y="362" class="box-sub">Extracts keywords from ticket text:</text>
    <text x="98" y="378" class="mono">dropbox, blocked, cloud storage,</text>
    <text x="98" y="392" class="mono">zscaler, access denied, vpn, ...</text>
    <text x="98" y="412" class="box-sub">Builds an embedded-search query.</text>
    <text x="98" y="428" class="box-sub">Falls back to a generic query if no</text>
    <text x="98" y="442" class="box-sub">keywords match.</text>
    <text x="98" y="465" class="small" font-style="italic">Phase 1.5: replace with LLM-based query</text>
    <text x="98" y="478" class="small" font-style="italic">rewriter (one cheap Haiku call).</text>

    <rect x="440" y="320" width="340" height="160" rx="8" fill="#FFFFFF" stroke="#A37200" stroke-width="1.2"/>
    <text x="458" y="343" class="box-title">2. RAG retrieval</text>
    <text x="458" y="362" class="mono">bedrock-agent-runtime.retrieve()</text>
    <text x="458" y="378" class="box-sub">Returns top KB_TOP_K (default 5)</text>
    <text x="458" y="394" class="box-sub">chunks: text, similarity score,</text>
    <text x="458" y="410" class="box-sub">S3 source URI, metadata.</text>
    <text x="458" y="430" class="box-sub">No semantic re-ranking yet.</text>
    <text x="458" y="453" class="small" font-style="italic">Cost: $0 per query (KB retrieve has no</text>
    <text x="458" y="466" class="small" font-style="italic">per-request charge; only storage costs).</text>

    <rect x="800" y="320" width="340" height="160" rx="8" fill="#FFFFFF" stroke="#A37200" stroke-width="1.2"/>
    <text x="818" y="343" class="box-title">3. LLM reasoning</text>
    <text x="818" y="362" class="box-sub">Augmented prompt: system prompt</text>
    <text x="818" y="378" class="box-sub">(persona + JSON schema + severity</text>
    <text x="818" y="394" class="box-sub">rubric) + ticket + retrieved chunks.</text>
    <text x="818" y="413" class="box-sub">Provider selected by LLM_PROVIDER:</text>
    <text x="818" y="429" class="mono">anthropic | bedrock_nova |</text>
    <text x="818" y="443" class="mono">bedrock_claude</text>
    <text x="818" y="465" class="small" font-style="italic">Returns strict JSON; script parses with</text>
    <text x="818" y="478" class="small" font-style="italic">code-fence stripping fallback.</text>

    <rect x="1160" y="320" width="380" height="160" rx="8" class="guardrail-fill" stroke="#E07B00" stroke-width="1.5"/>
    <text x="1178" y="343" class="box-title" fill="#A35200">Guardrail interception (Bedrock path only)</text>
    <text x="1178" y="362" class="box-sub">Bedrock Guardrails inspect both input</text>
    <text x="1178" y="378" class="box-sub">and output. Configured topics:</text>
    <text x="1178" y="396" class="box-sub">- Credential / secret sharing</text>
    <text x="1178" y="412" class="box-sub">- Security policy bypass requests</text>
    <text x="1178" y="428" class="box-sub">- SSL inspection disabling</text>
    <text x="1178" y="448" class="box-sub" font-weight="bold">If blocked: stopReason =</text>
    <text x="1178" y="462" class="mono" font-weight="bold">guardrail_intervened</text>
    <text x="1178" y="478" class="box-sub" font-weight="bold">→ critical finding (no LLM output)</text>
  </g>

  <!-- Row 3: Bedrock + storage -->
  <g>
    <rect x="60" y="540" width="280" height="320" rx="10" fill="#F4F8FC" stroke="#0F4C81" stroke-width="1.5"/>
    <text x="80" y="565" class="zone-title">Bedrock Knowledge Base</text>
    <text x="80" y="588" class="box-sub">ID:  N9PXXMAZBY  (example)</text>
    <text x="80" y="606" class="box-sub">Embeddings: Titan Embeddings v2</text>
    <text x="80" y="622" class="box-sub">  (1024-dim, $0.02 per 1M tokens)</text>
    <text x="80" y="642" class="box-sub">Chunking: default (300 tokens,</text>
    <text x="80" y="657" class="box-sub">  20% overlap)</text>
    <text x="80" y="677" class="box-sub">Data sources: S3 bucket</text>
    <text x="80" y="697" class="box-title">Indexed documents</text>
    <text x="80" y="715" class="box-sub">- Sample-SharePoint-AUP.docx</text>
    <text x="80" y="731" class="box-sub">  (section 4.2 lists Dropbox as approved)</text>
    <text x="80" y="751" class="box-sub">- zscaler-zia-url-filtering-policy.json</text>
    <text x="80" y="767" class="box-sub">  (rule blocks Cloud Storage category)</text>
    <text x="80" y="787" class="box-sub">- (more policies as they are loaded)</text>
    <text x="80" y="810" class="small" font-style="italic">Re-sync triggered manually in console</text>
    <text x="80" y="823" class="small" font-style="italic">on document upload. EventBridge in 1.5.</text>
    <text x="80" y="845" class="box-sub" font-weight="bold">Status: ACTIVE</text>

    <rect x="360" y="540" width="280" height="320" rx="10" fill="#F4F8FC" stroke="#0F4C81" stroke-width="1.5"/>
    <text x="380" y="565" class="zone-title">OpenSearch Serverless</text>
    <text x="380" y="588" class="box-sub">Backing vector store for KB.</text>
    <text x="380" y="606" class="box-sub">Auto-provisioned by Bedrock if</text>
    <text x="380" y="622" class="box-sub">"Quick create" selected.</text>
    <text x="380" y="643" class="box-sub">Capacity: 2 OCUs minimum</text>
    <text x="380" y="660" class="box-sub">(1 indexing + 1 search).</text>
    <text x="380" y="683" class="box-title">Cost reality</text>
    <text x="380" y="702" class="box-sub">Baseline ~$300 to $400 / month</text>
    <text x="380" y="718" class="box-sub">at minimum capacity. Largest line.</text>
    <text x="380" y="741" class="box-sub">Bills on provisioned OCUs, not on</text>
    <text x="380" y="757" class="box-sub">queries. Empty queries still cost.</text>
    <text x="380" y="785" class="small" font-style="italic">Production alternative: Aurora pgvector</text>
    <text x="380" y="798" class="small" font-style="italic">or Pinecone Serverless. Phase 1.5.</text>

    <rect x="660" y="540" width="320" height="320" rx="10" class="guardrail-fill" stroke="#E07B00" stroke-width="1.5"/>
    <text x="680" y="565" class="zone-title" fill="#A35200">Bedrock Guardrails</text>
    <text x="680" y="588" class="box-sub">ID:  heke8qyn3f2o  (example)</text>
    <text x="680" y="606" class="box-sub">Version:  1  (use a published version,</text>
    <text x="680" y="622" class="box-sub">  not DRAFT, in production)</text>
    <text x="680" y="645" class="box-title">Configured policies</text>
    <text x="680" y="664" class="box-sub">Denied topics:</text>
    <text x="680" y="680" class="box-sub">  - "Sharing credentials or secrets"</text>
    <text x="680" y="696" class="box-sub">  - "Disabling security controls"</text>
    <text x="680" y="712" class="box-sub">  - "Bypassing SSL inspection"</text>
    <text x="680" y="732" class="box-sub">Sensitive info filters (Bedrock</text>
    <text x="680" y="748" class="box-sub">built-ins):</text>
    <text x="680" y="764" class="box-sub">  - AWS access key</text>
    <text x="680" y="780" class="box-sub">  - AWS secret access key</text>
    <text x="680" y="796" class="box-sub">  - API key, password</text>
    <text x="680" y="815" class="box-sub" font-weight="bold">Action: BLOCK on input or output</text>
    <text x="680" y="835" class="small" font-style="italic">Trace logged to CloudWatch.</text>

    <rect x="1000" y="540" width="280" height="320" rx="10" fill="#F4F8FC" stroke="#0F4C81" stroke-width="1.5"/>
    <text x="1020" y="565" class="zone-title">Bedrock Foundation Models</text>
    <text x="1020" y="588" class="box-sub">Three options, env-selected:</text>
    <text x="1020" y="610" class="box-sub" font-weight="bold">Anthropic API (default)</text>
    <text x="1020" y="626" class="mono">claude-sonnet-4-6</text>
    <text x="1020" y="640" class="small">no AWS dep, ~$0.014/scan</text>
    <text x="1020" y="660" class="box-sub" font-weight="bold">Bedrock Claude</text>
    <text x="1020" y="676" class="mono">anthropic.claude-sonnet-4-6</text>
    <text x="1020" y="690" class="small">via Converse API, guardrails apply</text>
    <text x="1020" y="710" class="box-sub" font-weight="bold">Bedrock Nova</text>
    <text x="1020" y="726" class="mono">amazon.nova-lite-v1:0</text>
    <text x="1020" y="740" class="small">cheapest, ~$0.003/scan, guardrails</text>
    <text x="1020" y="755" class="small">apply</text>
    <text x="1020" y="780" class="box-title">Why three?</text>
    <text x="1020" y="798" class="small">Anthropic for personal-account demos.</text>
    <text x="1020" y="812" class="small">Bedrock for production (data stays in</text>
    <text x="1020" y="826" class="small">AWS + guardrails work).</text>
    <text x="1020" y="843" class="small">Nova as a cost lever.</text>

    <rect x="1300" y="540" width="260" height="320" rx="10" fill="#F4F8FC" stroke="#0F4C81" stroke-width="1.5"/>
    <text x="1320" y="565" class="zone-title">S3 source bucket</text>
    <text x="1320" y="588" class="box-sub">Holds policy artifacts that the</text>
    <text x="1320" y="603" class="box-sub">KB ingests.</text>
    <text x="1320" y="625" class="box-title">Folder layout</text>
    <text x="1320" y="645" class="mono">sharepoint/AUP.docx</text>
    <text x="1320" y="660" class="mono">zscaler/policy.json</text>
    <text x="1320" y="675" class="mono">data-class/POL-014.docx</text>
    <text x="1320" y="690" class="mono">network/POL-019.docx</text>
    <text x="1320" y="703" class="mono">aws-config/snapshots/...</text>
    <text x="1320" y="728" class="box-title">Security controls</text>
    <text x="1320" y="746" class="box-sub">- BlockPublicAccess on</text>
    <text x="1320" y="762" class="box-sub">- KMS-CMK encryption</text>
    <text x="1320" y="778" class="box-sub">- Versioning enabled</text>
    <text x="1320" y="794" class="box-sub">- Object Lock (Phase 1.5)</text>
    <text x="1320" y="817" class="small" font-style="italic">Sri's KB indexed ~3 docs at build time;</text>
    <text x="1320" y="830" class="small" font-style="italic">add more to expand conflict coverage.</text>
  </g>

  <!-- Row 4: Output -->
  <g>
    <rect x="60" y="900" width="600" height="150" rx="10" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
    <text x="80" y="925" class="zone-title" fill="#5E35B1">MS Teams Workflows automation</text>
    <text x="80" y="948" class="box-sub">Receives a POST with the Adaptive Card v1.4 envelope.</text>
    <text x="80" y="966" class="box-sub">Trigger: "When a Teams webhook request is received"</text>
    <text x="80" y="982" class="box-sub">Action: "Post adaptive card in a chat or channel"</text>
    <text x="80" y="1000" class="box-sub">Returns HTTP 202 (accepted, async).</text>
    <text x="80" y="1020" class="box-sub" font-weight="bold">Card layout: severity-colored header, summary, user intent,</text>
    <text x="80" y="1038" class="box-sub" font-weight="bold">Policy A (permits) + Policy B (blocks), recommended action.</text>

    <rect x="680" y="900" width="440" height="150" rx="10" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
    <text x="700" y="925" class="zone-title" fill="#5E35B1">Output: structured JSON finding</text>
    <text x="700" y="946" class="mono">conflict_detected: true | false</text>
    <text x="700" y="960" class="mono">confidence: 0.0 to 1.0</text>
    <text x="700" y="974" class="mono">summary, ticket_user_intent</text>
    <text x="700" y="988" class="mono">policy_a: { source, excerpt, interpretation }</text>
    <text x="700" y="1002" class="mono">policy_b: { source, excerpt, interpretation }</text>
    <text x="700" y="1016" class="mono">recommendation</text>
    <text x="700" y="1030" class="mono">severity: critical | high | medium | low | informational</text>

    <rect x="1140" y="900" width="420" height="150" rx="10" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1160" y="925" class="zone-title">Observability + audit</text>
    <text x="1160" y="946" class="box-sub">CloudWatch Logs:</text>
    <text x="1160" y="962" class="box-sub">- Agent stdout (Lambda execution logs)</text>
    <text x="1160" y="978" class="box-sub">- Bedrock model invocation logs (S3 archive)</text>
    <text x="1160" y="994" class="box-sub">- Guardrail trace (outputAssessments)</text>
    <text x="1160" y="1014" class="box-sub">CloudTrail org trail: every API call.</text>
    <text x="1160" y="1032" class="box-sub" font-style="italic">For Phase 1, stdout is enough; Phase 1.5</text>
    <text x="1160" y="1046" class="box-sub" font-style="italic">adds X-Ray + custom CloudWatch metrics.</text>
  </g>

  <!-- Arrows -->
  <g stroke="#3B4757" stroke-width="2" fill="none">
    <!-- Input → Agent runtime step 1 -->
    <path d="M 220 240 L 220 280 L 250 280" marker-end="url(#ar)"/>
    <text x="155" y="263" class="small">ticket text</text>
    <!-- Step 1 → Step 2 -->
    <path d="M 420 400 L 440 400" marker-end="url(#ar)"/>
    <!-- Step 2 → Step 3 -->
    <path d="M 780 400 L 800 400" marker-end="url(#ar)"/>
    <!-- Step 2 down to KB -->
    <path d="M 610 480 L 610 540" marker-end="url(#ar)"/>
    <text x="540" y="510" class="small">retrieve(query)</text>
    <!-- KB up to Step 2 -->
    <path d="M 300 540 L 300 480 L 440 480" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <text x="240" y="515" class="small">top-K chunks</text>
    <!-- Step 3 down to Guardrails -->
    <path d="M 970 480 L 970 540" stroke="#E07B00" marker-end="url(#ar)"/>
    <!-- Step 3 down to FM -->
    <path d="M 1100 480 L 1100 540" marker-end="url(#ar)"/>
    <text x="970" y="510" class="small" fill="#A35200">policy inspection</text>
    <text x="1100" y="510" class="small">converse() / messages</text>
    <!-- Step 3 → Output (finding) -->
    <path d="M 970 480 L 970 850 L 900 850 L 900 900" stroke-dasharray="2 2" marker-end="url(#ar)"/>
    <text x="975" y="850" class="small">finding JSON</text>
    <!-- Guardrail box → Step 3 (synthesized finding on block) -->
    <path d="M 1340 320 L 1340 480 L 970 480" stroke="#E07B00" stroke-dasharray="3 3"/>
    <text x="1185" y="305" class="small" fill="#A35200">if blocked → synthetic finding</text>
    <!-- finding → Teams -->
    <path d="M 700 540 L 700 900" stroke-dasharray="2 2" marker-end="url(#ar)"/>
    <!-- Step 3 down to Teams (via Output) -->
    <path d="M 340 900 L 340 870 L 970 870 L 970 500" stroke-dasharray="0" fill="none" stroke="none"/>
    <path d="M 340 870 L 340 900" marker-end="url(#ar)"/>
    <text x="350" y="888" class="small">POST adaptive card</text>
  </g>

  <text x="40" y="1075" class="legend">Solid arrows = synchronous request flow. Dashed arrows = data return. Orange (Guardrail) path supersedes the normal model output on intervention.</text>
</svg>
